v class="nectar-responsive-text nectar-link-underline-effect"><p>Civil engineering · Structural analysis · EdTech / SaaS</p></div></div></div></div></div></div><div id="fws_6ab5cc20162a6" data-midnight="" data-column-margin="default" class="wpb_row vc_row-fluid vc_row inner_row" style=""><div class="row-bg-wrap"><div class="row-bg"></div></div><div class="row_col_wrap_12_inner col span_12  left"><div class="vc_col-sm-12 wpb_column column_container vc_column_container col child_column no-extra-padding el_spacing_10px inherit_tablet inherit_phone flex_gap_desktop_10px " data-padding-pos="all" data-has-bg-color="false" data-bg-color="" data-bg-opacity="1" data-animation="" data-delay="0"><div class="vc_column-inner"><div class="wpb_wrapper"><div class="nectar-responsive-text font_line_height_1-2 nectar-link-underline-effect"><h5><strong>Approach</strong></h5></div><div class="nectar-responsive-text nectar-link-underline-effect"><p data-start="988" data-end="1268">We built a compact brand system using Adobe Creative Cloud, with a geometric logotype and symbol inspired by structural sections and beams. The visual language balances technical precision with a friendly tone through a clean icon set and a focused color palette.</p><p data-start="1270" data-end="1719">For the website, we designed the interface in Figma and translated it into a responsive front-end using React, HTML, CSS, and JavaScript. Working closely with a developer friend, we used GitHub for version control (branches, commits, pull requests) and deployed the site on Netlify, including domain connection and basic configuration. The result is a fast, simple experience that leads users straight into the Cross Section and Beam Solver tools.</p></div><div class="divider-wrap" data-alignment="default"><div style="height: 25px;" class="divider"></div></div><div class="nectar-responsive-text font_line_height_1-2 nectar-link-underline-effect" style="color: #000000;"><h5><strong>Services</strong></h5></div><div class="nectar-fancy-ul" data-list-icon="dot" data-animation="false" data-animation-delay="0" data-spacing="default" data-alignment="left"><ul><li data-start="1738" data-end="1754"><p data-start="1740" data-end="1754">Brand system</p></li><li data-start="1755" data-end="1769"><p data-start="1757" data-end="1769">Guidelines</p></li><li data-start="1770" data-end="1780"><p data-start="1772" data-end="1780">UI kit</p></li><li data-start="1781" data-end="1821"><p data-start="1783" data-end="1821">Web design and front-end development</p></li><li data-start="1822" data-end="1861"><p data-start="1824" data-end="1861">Netlify deployment and domain setup</p></li></ul></div><div class="divider-wrap" data-alignment="default"><div style="height: 25px;" class="divider"></div></div><div class="nectar-responsive-text font_line_height_1-2 nectar-link-underline-effect"><h5><strong>What We Do</strong></h5></div><div class="nectar-fancy-ul" data-list-icon="dot" data-animation="false" data-animation-delay="0" data-spacing="15px" data-alignment="left"><ul><li data-start="1882" data-end="2064"><p data-start="1884" data-end="2064"><strong data-start="1884" data-end="1919">Brand strategy &amp; key messaging:</strong> Defined Civilus as an accessible, online companion for structural calculations, with messaging focused on speed, reliability, and ease of use.</p></li><li data-start="2065" data-end="2208"><p data-start="2067" data-end="2208"><strong data-start="2067" data-end="2088">Brand guidelines:</strong> Usage rules for logo, color, and imagery to keep the brand consistent across the website, decks, and social channels.</p></li><li data-start="2209" data-end="2309"><p data-start="2211" data-end="2309"><strong data-start="2211" data-end="2231">Identity system:</strong> Logotype and icon for use on the site header, favicons, and social avatars.</p></li><li data-start="2310" data-end="2430"><p data-start="2312" data-end="2430"><strong data-start="2312" data-end="2329">Color system:</strong> Technical yet approachable palette with strong contrast for UI, charts, and call-to-action states.</p></li><li data-start="2431" data-end="2552"><p data-start="2433" data-end="2552"><strong data-start="2433" data-end="2455">Typography system:</strong> Google Fonts stack optimized for legibility in dense numerical interfaces and small UI labels.</p></li><li data-start="2553" data-end="2675"><p data-start="2555" data-end="2675"><strong data-start="2555" data-end="2566">UI kit:</strong> Buttons, inputs, cards, tables, and layout components designed for reusability across new tools and pages.</p></li><li data-start="2676" data-end="2809"><p data-start="2678" data-end="2809"><strong data-start="2678" data-end="2690">Website:</strong> Landing page, tools overview, and contact form designed and coded for a smooth path from explanation to calculation.</p></li></ul></div><div class="divider-wrap" data-alignment="default"><div style="height: 25px;" class="divider"></div></div><div class="nectar-responsive-text font_line_height_1-2 nectar-link-underline-effect"><h5><strong>Stack</strong></h5></div><div class="nectar-fancy-ul" data-list-icon="dot" data-animation="false" data-animation-delay="0" data-spacing="default" data-alignment="left"><ul><li data-start="2825" data-end="2875"><p data-start="2827" data-end="2875">Adobe Creative Cloud (Illustrator / Photoshop)</p></li><li data-start="2876" data-end="2885"><p data-start="2878" data-end="2885">Figma</p></li><li data-start="2886" data-end="2902"><p data-start="2888" data-end="2902">Google Fonts</p></li><li data-start="2903" data-end="2914"><p data-start="2905" data-end="2914">VS Code</p></li><li data-start="2915" data-end="2950"><p data-start="2917" data-end="2950">React · HTML · CSS · JavaScript</p></li><li data-start="2951" data-end="2979"><p data-start="2953" data-end="2979">GitHub (version control)</p></li><li data-start="2980" data-end="3009"><p data-start="2982" data-end="3009">Netlify (build &amp; hosting)</p></li></ul></div><div class="divider-wrap" data-alignment="default"><div style="height: 25px;" class="divider"></div></div><div class="nectar-responsive-text font_line_height_1-2 nectar-link-underline-effect"><h5><strong>Timeline</strong></h5></div><div class="nectar-responsive-text nectar-link-underline-effect"><p data-start="3028" data-end="3075">6–8 weeks from brand refresh to live website</p></div><div class="divider-wrap" data-alignment="default"><div style="height: 25px;" class="divider"></div></div><div class="nectar-responsive-text font_line_height_1-2 nectar-link-underline-effect"><h5><strong>Impact</strong></h5></div><div class="nectar-responsive-text nectar-link-underline-effect"><p>A cohesive brand and responsive site that make Civilus technical tools feel approachable and trustworthy, helping students and professionals quickly understand the value of the platform and start solving structural problems online.</p></div><div class="divider-wrap" data-alignment="default"><div style="height: 25px;" class="divider"></div></div><div class="nectar-responsive-text font_line_height_1-2 nectar-link-underline-effect"><h5><strong>Deliverables</strong></h5></div><div class="nectar-fancy-ul" data-list-icon="dot" data-animation="false" data-animation-delay="0" data-spacing="default" data-alignment="left"><ul><li data-start="3349" data-end="3376"><p data-start="3351" data-end="3376">Brand mini-manual (PDF)</p></li><li data-start="3377" data-end="3410"><p data-start="3379" data-end="3410">Logo and icon files (SVG/PNG)</p></li><li data-start="3411" data-end="3441"><p data-start="3413" data-end="3441">Color and typography specs</p></li><li data-start="3442" data-end="3475"><p data-start="3444" data-end="3475">UI components library (Figma)</p></li><li data-start="3476" data-end="3516"><p data-start="3478" data-end="3516">Responsive landing page and tools UI</p></li><li data-start="3517" data-end="3581"><p data-start="3519" data-end="3581">Netlify deployment, domain connection, and basic co
